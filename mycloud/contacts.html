        .count-pill{margin-left:auto;font-size:13px;font-weight:700;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);white-space:nowrap;}

            background:linear-gradient(180deg,rgba(80,60,170,.92),rgba(80,60,170,.78));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.12);}
        .search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:0 14px;}
        .search i{opacity:.8;font-size:15px;}
        .search input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font:600 16px 'Exo 2',sans-serif;padding:14px 0;}
        .search input::placeholder{color:rgba(255,255,255,.7);font-weight:500;}
        .search .clear{display:none;width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.28);color:#fff;font-size:14px;line-height:1;cursor:pointer;}
        .search.has .clear{display:block;}
        .row-btns{display:flex;gap:10px;margin-top:10px;}
        .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;font:700 15px 'Exo 2',sans-serif;cursor:pointer;}
        .btn.primary{background:linear-gradient(145deg,#c58bff,#6a47ea);border-color:transparent;box-shadow:0 8px 18px rgba(30,10,70,.3);}
        .btn:active{transform:scale(.97);}

        .letter{position:sticky;top:112px;z-index:5;font-size:13px;font-weight:800;letter-spacing:.1em;padding:10px 6px 6px;color:#ffd1f0;text-transform:uppercase;}
        .group{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:18px;overflow:hidden;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin-bottom:6px;}
        .c{border-top:1px solid rgba(255,255,255,.12);}
        .c:first-child{border-top:none;}
        .c-top{display:flex;align-items:center;gap:13px;padding:12px 14px;cursor:pointer;}
        .c-top:active{background:rgba(255,255,255,.1);}
        .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px rgba(0,0,0,.2);}
        .nm{flex:1;min-width:0;}
        .nm b{display:block;font-size:17px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .nm span{display:block;font-size:13.5px;opacity:.75;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .chev{opacity:.6;font-size:14px;transition:transform .2s;}
        .c.open .chev{transform:rotate(90deg);}
        .c-det{display:none;padding:2px 14px 14px 73px;}
        .c.open .c-det{display:block;}
        .line{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35;padding:5px 0;overflow-wrap:anywhere;}

        const COLOURS = [
            'linear-gradient(145deg,#ff7ab8,#d6246e)','linear-gradient(145deg,#5aa2ff,#2160e0)','linear-gradient(145deg,#34d399,#0f9d6b)',
            'linear-gradient(145deg,#ffc94d,#f08a00)','linear-gradient(145deg,#ff7a6b,#d93025)','linear-gradient(145deg,#2ee0d0,#0c8f95)',
            'linear-gradient(145deg,#a58bff,#6a47ea)'
        ];
        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        const clean = v => (v || '').trim();
        const colourFor = c => COLOURS[(c.firstName.charCodeAt(0) + c.lastName.charCodeAt(0)) % COLOURS.length];

        function detailLine(icon, text, href) {
            const l = el('div', 'line'); l.appendChild(el('i', 'fas ' + icon));
            if (href) { const a = el('a', '', text); a.href = href; l.appendChild(a); } else l.appendChild(el('span', '', text));
            return l;
        }

        function buildContact(c) {
            const row = el('div', 'c');
            const top = el('div', 'c-top');
            const av = el('div', 'av', c.firstName.charAt(0).toUpperCase() + c.lastName.charAt(0).toUpperCase()); av.style.background = colourFor(c);
            const nm = el('div', 'nm'); nm.appendChild(el('b', '', c.firstName + ' ' + c.lastName));
            nm.appendChild(el('span', '', clean(c.company) || clean(c.phone)));
            top.appendChild(av); top.appendChild(nm); top.appendChild(el('i', 'fas fa-chevron-right chev'));
            const det = el('div', 'c-det');
            if (clean(c.phone)) det.appendChild(detailLine('fa-phone', c.phone, 'tel:' + c.phone.replace(/[^+\d]/g, '')));
            if (clean(c.email)) det.appendChild(detailLine('fa-envelope', c.email, 'mailto:' + c.email));
            if (clean(c.company)) det.appendChild(detailLine('fa-building', c.company));
            if (clean(c.address)) det.appendChild(detailLine('fa-location-dot', clean(c.address)));
            if (clean(c.notes)) { const n = el('div', 'note'); n.appendChild(el('small', '', 'Notes')); n.appendChild(document.createTextNode(c.notes)); det.appendChild(n); }
            top.addEventListener('click', () => row.classList.toggle('open'));
            row.appendChild(top); row.appendChild(det);
            return row;
        }

        function displayContacts() {
            const box = document.getElementById('contactsContainer');
            box.textContent = '';
            if (filteredContacts.length === 0) {
                const e = el('div', 'empty'); e.appendChild(el('i', allContactsVisible ? 'fas fa-user-slash' : 'fas fa-address-book'));
                e.appendChild(el('h3', '', allContactsVisible ? 'No matching contacts' : 'Contact Directory ready'));
                e.appendChild(el('p', '', allContactsVisible ? 'Try a different search, or clear it to see everyone.' : 'Tap "Show all contacts" to see the whole list, or type in the search bar to filter.'));
                box.appendChild(e); return;
            }
            const sorted = filteredContacts.slice().sort((a, b) => (a.firstName + ' ' + a.lastName).localeCompare(b.firstName + ' ' + b.lastName));
            let last = '', group = null;
            sorted.forEach(c => {
                const L = c.firstName.charAt(0).toUpperCase();
                if (L !== last) { last = L; box.appendChild(el('div', 'letter', L)); group = el('div', 'group'); box.appendChild(group); }
                group.appendChild(buildContact(c));
            });
        }

        function filterContacts() {
            const input = document.getElementById('searchInput');
            const term = input.value.toLowerCase().trim();
            document.querySelector('.search').classList.toggle('has', !!input.value);
            if (!term && !allContactsVisible) {
                filteredContacts = [];
            } else if (!term) {
                filteredContacts = contacts.map((c, i) => ({ ...c, originalIndex: i }));
            } else {
                filteredContacts = contacts.map((c, i) => ({ ...c, originalIndex: i })).filter(c =>
                    [c.firstName, c.lastName, c.email, c.phone, c.company, c.address, c.notes].some(v => v && v.toLowerCase().includes(term)));
                allContactsVisible = true;
            }
            displayContacts(); updateStats();
        }

        function showAllContacts() {
            allContactsVisible = true;
            document.getElementById('searchInput').value = '';
            document.querySelector('.search').classList.remove('has');
            filteredContacts = contacts.map((c, i) => ({ ...c, originalIndex: i }));
            displayContacts(); updateStats();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateStats() {
            const pill = document.getElementById('countPill');
            pill.textContent = filteredContacts.length && filteredContacts.length !== contacts.length
                ? filteredContacts.length + ' of ' + contacts.length : contacts.length + ' contacts';
        }

        document.getElementById('searchInput').addEventListener('input', filterContacts);
        document.getElementById('clearBtn').addEventListener('click', () => { const i = document.getElementById('searchInput'); i.value = ''; filterContacts(); i.focus(); });

        initSampleData();
    </script>

    <script src="/js/backbar.js?v=20261119a" defer></script>
</body>
