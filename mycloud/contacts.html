            background: none;
            padding: 0.25rem 0;
        }
        
        .header h1 {

            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* New button style for "Back to Dashboard" */
        .back-btn {

            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;

            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #4CAF50, #228B22);
        }

        .back-btn:active {
            transform: translateY(0);
        }
        
        .main-content {
            padding: 0;
            width: 100%;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: nowrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 0;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 11px 38px 11px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .search-box input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .search-icon {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.75);
        }
        
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24); /* Logout button gradient */
            color: white;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.4);
            background: linear-gradient(135deg, #ff5252, #d63031);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            box-shadow: none;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
            box-shadow: none;
        }
        
        .contacts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        
        .contact-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }
        
        .contact-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .contact-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .contact-avatar {

            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #88c0d0 0%, #a3be8c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 17px;
            margin-right: 13px;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);

        .contact-name {

            line-height: 1.45;
        }

            color: #ffffff;
            min-width: 66px;
            flex-shrink: 0;
            font-weight: 600;
        }

        function displayContacts() {
            const container = document.getElementById('contactsContainer');
            
            if (filteredContacts.length === 0 && !allContactsVisible) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Contact Directory Ready</h3>
                        <p>Click "Show All Contacts" to view the entire list or type anything in the search bar to filter</p>
                    </div>
                `;
                return;
            }

            if (filteredContacts.length === 0 && allContactsVisible) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No matching contacts</h3>
                        <p>Try adjusting your search terms or clear the search to see all contacts</p>
                    </div>
                `;
                return;
            }

            const contactsHTML = filteredContacts.map((contact, index) => `
                <div class="contact-card">
                    <div class="contact-header">
                        <div class="contact-avatar">
                            ${contact.firstName.charAt(0).toUpperCase()}${contact.lastName.charAt(0).toUpperCase()}
                        </div>
                        <h3 class="contact-name">${contact.firstName} ${contact.lastName}</h3>
                    </div>
                    <div class="contact-info">
                        ${contact.email ? `<div class="contact-detail"><strong>Email:</strong> ${contact.email}</div>` : ''}
                        ${contact.phone ? `<div class="contact-detail"><strong>Phone:</strong> ${contact.phone}</div>` : ''}
                        ${contact.company ? `<div class="contact-detail"><strong>Company:</strong> ${contact.company}</div>` : ''}
                        ${contact.address ? `<div class="contact-detail"><strong>Address:</strong> ${contact.address}</div>` : ''}
                        ${contact.notes ? `<div class="contact-detail"><strong>Notes:</strong> ${contact.notes}</div>` : ''}
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="contacts-grid">${contactsHTML}</div>`;
        }

        function filterContacts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchTerm && !allContactsVisible) {
                filteredContacts = [];
            } else if (!searchTerm) {
                filteredContacts = contacts.map((contact, index) => ({
                    ...contact,
                    originalIndex: index
                }));
            } else {
                filteredContacts = contacts
                    .map((contact, index) => ({ ...contact, originalIndex: index }))
                    .filter(contact => 
                        contact.firstName.toLowerCase().includes(searchTerm) ||
                        contact.lastName.toLowerCase().includes(searchTerm) ||
                        (contact.email && contact.email.toLowerCase().includes(searchTerm)) ||
                        (contact.phone && contact.phone.toLowerCase().includes(searchTerm)) ||
                        (contact.company && contact.company.toLowerCase().includes(searchTerm)) ||
                        (contact.address && contact.address.toLowerCase().includes(searchTerm)) ||
                        (contact.notes && contact.notes.toLowerCase().includes(searchTerm))
                    );
                allContactsVisible = true;
            }
            
            displayContacts();
            updateStats();
        }

        function showAllContacts() {
            allContactsVisible = true;
            document.getElementById('searchInput').value = '';
            filteredContacts = contacts.map((contact, index) => ({
                ...contact,
                originalIndex: index
            }));
            displayContacts();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalContacts').textContent = contacts.length;
            document.getElementById('filteredContacts').textContent = filteredContacts.length;
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterContacts);

        // Initialize the app
        initSampleData();
    </script>
