<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preload" href="/fonts/exo-2-300.woff2?v=20261119a" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css?v=20261119a">
    <link rel="stylesheet" href="/css/base.css?v=20261119a">
    <link rel="stylesheet" href="/mycloud/css/all.min.css?v=20261119a">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261119a">
    <title>MyCloudHome</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            -webkit-text-size-adjust: 100%;
            padding-bottom: 40px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 226, 0.3) 0%, transparent 50%);
            animation: float 150s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* Banner */
        .banner {
            width: 100%;
            max-width: 380px;
            margin-bottom: 28px;
            opacity: 0;
            animation: slideDown 0.8s ease-out 0.2s forwards;
        }

        .banner img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            width: 100%;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 24px 16px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease-out forwards;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            -webkit-tap-highlight-color: transparent;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.25s; }
        .card:nth-child(5) { animation-delay: 0.3s; }
        .card:nth-child(6) { animation-delay: 0.35s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
        }

        /* Icon */
        .icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .icon i {
            font-size: 48px;
        }

        .card:active .icon {
            transform: scale(0.9);
        }

        .card p {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        /* Settings card: full width, half height */
        .card.settings-card {
            grid-column: 1 / -1;
            min-height: 70px;
            flex-direction: row;
            gap: 16px;
            padding: 12px 20px;
        }

        .card.settings-card .icon {
            width: 40px;
            height: 40px;
        }

        .card.settings-card .icon i {
            font-size: 40px;
        }

        .card.settings-card p {
            font-size: 16px;
            text-align: left;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 20px 20px;
            text-align: center;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .logout-btn,
        .return-desktop-btn {
            flex: 1;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 50px;
            -webkit-tap-highlight-color: transparent;
        }

        .return-desktop-btn {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.3);
        }

        .logout-btn:active,
        .return-desktop-btn:active {
            transform: scale(0.97);
        }

        .logout-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .copyright {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
            margin-top: 4px;
        }

        /* Responsive */
        @media screen and (max-width: 360px) {
            .container {
                padding: 16px;
            }

            .grid {
                gap: 12px;
            }

            .card {
                padding: 20px 14px;
                min-height: 130px;
            }

            .icon {
                width: 44px;
                height: 44px;
            }

            .icon i {
                font-size: 44px;
            }

            .card p {
                font-size: 14px;
            }

            .banner {
                max-width: 320px;
            }
        }

        @media screen and (min-width: 400px) {
            .card {
                min-height: 150px;
                padding: 28px 18px;
            }

            .icon {
                width: 52px;
                height: 52px;
            }

            .icon i {
                font-size: 52px;
            }

            .card p {
                font-size: 16px;
            }
        }

        /* Single column for very small screens */
        @media screen and (max-width: 340px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── livelier dashboard ── */
        .hero{width:100%;margin-bottom:18px;border-radius:22px;padding:16px 18px 14px;background:linear-gradient(150deg,rgba(20,8,40,.62),rgba(60,20,100,.5));border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 36px rgba(20,5,40,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;overflow:hidden;opacity:0;animation:fadeInUp .5s ease-out .15s forwards;}
        .hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
        .hero-label{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.75;}
        .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:#b8ffd9;background:rgba(52,211,153,.18);padding:6px 11px;border-radius:20px;}
        .live i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 1.8s infinite;}
        @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
        .hero h2{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:8px 0 12px;line-height:1.2;}
        .chips{display:flex;gap:8px;flex-wrap:wrap;}
        .chip{font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);}
        .chip b{color:#ffd1f0;}
        .sec{width:100%;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin:22px 4px 10px;}
        .feed{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;overflow:hidden;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
        .fi{display:flex;align-items:center;gap:12px;padding:12px 14px;animation:fin .45s ease;}
        .fi + .fi{border-top:1px solid rgba(255,255,255,.14);}
        @keyframes fin{from{opacity:0;transform:translateY(-10px);background:rgba(255,255,255,.2);}to{opacity:1;transform:none;background:transparent;}}
        .fi .d{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;}
        .fi .t{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;}
        .fi .t small{display:block;font-weight:500;opacity:.7;font-size:12.5px;margin-top:1px;}
        .d-pink{background:linear-gradient(145deg,#ff7ab8,#d6246e);} .d-blue{background:linear-gradient(145deg,#5aa2ff,#2160e0);} .d-red{background:linear-gradient(145deg,#ff7a6b,#d93025);} .d-gold{background:linear-gradient(145deg,#ffc94d,#f08a00);}
        /* coloured icon badges on the tiles */
        .icon{border-radius:16px;padding:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.22);}
        .icon i{font-size:inherit !important;line-height:1;}
        .card:nth-child(1) .icon{background:linear-gradient(145deg,#ff7ab8,#d6246e);}
        .card:nth-child(2) .icon{background:linear-gradient(145deg,#5aa2ff,#2160e0);}
        .card:nth-child(3) .icon{background:linear-gradient(145deg,#34d399,#0f9d6b);}
        .card:nth-child(4) .icon{background:linear-gradient(145deg,#ffc94d,#f08a00);}
        .card:nth-child(5) .icon{background:linear-gradient(145deg,#ff7a6b,#d93025);}
        .card:nth-child(6) .icon{background:linear-gradient(145deg,#2ee0d0,#0c8f95);}
        .card:nth-child(7) .icon{background:linear-gradient(145deg,#aab2c0,#6b7486);}
        .card p small{display:block;font-size:12.5px;font-weight:500;opacity:.75;margin-top:2px;}
        @media (prefers-reduced-motion:reduce){ .live i,.fi,.hero{animation:none;opacity:1;} }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner -->
        <div class="banner">
            <img src="./images/mycloudbanner.png" alt="MyCloudHome Banner" loading="lazy">
        </div>

        <div class="hero">
            <div class="hero-top"><span class="hero-label">Device tracked</span><span class="live"><i></i>LIVE</span></div>
            <h2>iPhone 15 Pro - ness phone</h2>
            <div class="chips"><span class="chip"><b>29</b> photos</span><span class="chip"><b>43</b> contacts</span><span class="chip"><b>3</b> CCTV feeds</span></div>
        </div>

        <!-- Grid -->
        <div class="grid">
            <a href="photos.html" class="card">
                <div class="icon">
                    <svg viewBox="0 0 512 512">
                        <path d="M448 80c8.8 0 16 7.2 16 16V415.8l-5-6.5-136-176c-4.5-5.9-11.6-9.3-19-9.3s-14.4 3.4-19 9.3L202 340.7l-30.5-42.7C167 291.7 159.8 288 152 288s-15 3.7-19.5 10.1l-80 112L48 416.3l0-.3V96c0-8.8 7.2-16 16-16H448zM64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H64zm80 192a48 48 0 1 0 0-96 48 48 0 1 0 0 96z"/>
                    </svg>
                </div>
                <p>Photos<small>29 items</small></p>
            </a>

            <a href="contacts.html" class="card">
                <div class="icon">
                    <svg viewBox="0 0 512 512">
                        <path d="M96 0C60.7 0 32 28.7 32 64V448c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V64c0-35.3-28.7-64-64-64H96zM208 288h64c44.2 0 80 35.8 80 80c0 8.8-7.2 16-16 16H144c-8.8 0-16-7.2-16-16c0-44.2 35.8-80 80-80zm-32-96a64 64 0 1 1 128 0 64 64 0 1 1 -128 0zM512 80c0-8.8-7.2-16-16-16s-16 7.2-16 16v64c0 8.8 7.2 16 16 16s16-7.2 16-16V80zM496 192c-8.8 0-16 7.2-16 16v64c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16zm16 144c0-8.8-7.2-16-16-16s-16 7.2-16 16v64c0 8.8 7.2 16 16 16s16-7.2 16-16V336z"/>
                    </svg>
                </div>
                <p>Contacts<small>43 people</small></p>
            </a>

            <a href="./map/map.html" class="card">
                <div class="icon">
                    <svg viewBox="0 0 384 512">
                        <path d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/>
                    </svg>
                </div>
                <p>Map Tracker</p>
            </a>

            <a href="./cctv/cctv.html" class="card">
                <div class="icon">
                    <svg viewBox="0 0 576 512">
                        <path d="M0 128C0 92.7 28.7 64 64 64H320c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128zM559.1 99.8c10.4 5.6 16.9 16.4 16.9 28.2V384c0 11.8-6.5 22.6-16.9 28.2s-23 5-32.9-1.6l-96-64L416 337.1V320 192 174.9l14.2-9.5 96-64c9.8-6.5 22.4-7.2 32.9-1.6z"/>
                    </svg>
                </div>
                <p>CCTV<small>3 cameras</small></p>
            </a>

            <a href="keylog.html" class="card">
                <div class="icon">
                    <svg viewBox="0 0 384 512">
                        <path d="M16 64C16 28.7 44.7 0 80 0H304c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H80c-35.3 0-64-28.7-64-64V64zm96 384c0 8.8 7.2 16 16 16H256c8.8 0 16-7.2 16-16s-7.2-16-16-16H128c-8.8 0-16 7.2-16 16z"/>
                    </svg>
                </div>
                <p>Keylogger<small>live</small></p>
            </a>

            <a href="finance.html" class="card">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="7" y="2" width="10" height="20" rx="2"/>
                        <circle cx="12" cy="19" r="0.8" fill="currentColor" stroke="none"/>
                        <path d="M10 5h4"/>

                </div>

            <a href="settings.html" class="card settings-card">

        </div>

        <div class="sec">Live activity</div>
        <div class="feed" id="feed" aria-live="polite"></div>
    </div>

    <p class="copyright" style="text-align:center;padding:18px 0 30px;position:relative;z-index:1;">© 2025 myCloud remote network solutions LLC</p>

    <script>
        // Add ripple effect to cards
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card');
            
            cards.forEach(card => {
                card.addEventListener('click', function(e) {
                    const ripple = document.createElement('div');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.cssText = `
                        position: absolute;
                        width: ${size}px;
                        height: ${size}px;
                        left: ${x}px;
                        top: ${y}px;
                        background: rgba(255, 255, 255, 0.3);
                        border-radius: 50%;
                        transform: scale(0);
                        animation: ripple 0.6s linear;
                        pointer-events: none;
                        z-index: 1;
                    `;
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(2);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });

        // live activity feed: replays the sort of things the tracker picks up
        (function(){
            var items=[
              ['d-red','fa-keyboard','Keylogger','typed: "summer dresses"'],
              ['d-gold','fa-video','CCTV','Camera 2 motion detected'],
              ['d-blue','fa-address-book','Contacts','Contact list synced'],
              ['d-red','fa-keyboard','Keylogger','typed: "blue wedding guest dress"'],
              ['d-pink','fa-image','Photos','New photo backed up'],
              ['d-red','fa-keyboard','Keylogger','typed: "healthy lunch ideas for work"'],
              ['d-gold','fa-video','CCTV','Camera 1 recording'],
              ['d-pink','fa-image','Photos','New photo backed up']
            ];
            var feed=document.getElementById('feed'), n=0;
            function add(){
              var it=items[n++%items.length], row=document.createElement('div'); row.className='fi';
              row.innerHTML='<div class="d '+it[0]+'"><i class="fas '+it[1]+'"></i></div><div class="t"></div>';
              var t=row.querySelector('.t'); t.textContent=it[2]; var sm=document.createElement('small'); sm.textContent=it[3]+' · just now'; t.appendChild(sm);
              feed.insertBefore(row,feed.firstChild);
              while(feed.children.length>4) feed.removeChild(feed.lastChild);
              var olds=feed.querySelectorAll('small'); for(var k=1;k<olds.length;k++) olds[k].textContent=olds[k].textContent.replace('just now',(k*4)+' sec ago').replace(/\d+ sec ago/,(k*4)+' sec ago');
            }
            add();add();add();
            setInterval(add,4000);
        })();
    </script>
    <script src="/js/hints.js?v=20261119a" defer></script>
    <script src="/js/backbar.js?v=20261119a" defer></script>
</body>
</html>
