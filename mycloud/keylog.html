  <style>
    /* General styles copied from MyCloudHome Dashboard for consistency */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                  radial-gradient(circle at 40% 40%, rgba(120, 219, 226, 0.2) 0%, transparent 50%);
      animation: float 150s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 2rem;
      text-align: center;
      opacity: 0;
      animation: slideDown 0.8s ease-out 0.2s forwards;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .checklist-section {
      width: 100%;
      max-width: 700px;
      margin-bottom: 120px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 700px;
    }

    .action-btn {
      background: linear-gradient(135deg, #007bff, #0056b3); /* Blue gradient */
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0, 123, 255, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn.red {
      background: linear-gradient(135deg, #dc3545, #b02a37); /* Red gradient */
      box-shadow: 0 10px 20px rgba(220, 53, 69, 0.3);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 123, 255, 0.4);
    }

    .action-btn.red:hover {
      box-shadow: 0 15px 30px rgba(220, 53, 69, 0.4);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .checklist-item {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .checklist-item.hidden {
      display: none;
    }

    .checklist-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .checklist-item:hover::before {
      left: 100%;
    }

    .checklist-item:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .checklist-item input[type="checkbox"] {
      appearance: none; /* Hide default checkbox */
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid white;
      border-radius: 5px;
      margin-right: 1rem;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .checklist-item input[type="checkbox"]:checked {
      background-color: #4CAF50; /* Green check */
      border-color: #4CAF50;
    }

    .checklist-item input[type="checkbox"]:checked::after {
      content: '\2713'; /* Checkmark icon */
      font-size: 16px;
      color: white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .checklist-item-text {
      flex-grow: 1;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .checklist-item input[type="checkbox"]:checked + .checklist-item-text {
      text-decoration: line-through;
      opacity: 0.7;
    }

    .checklist-date-header {
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      text-align: left;
      width: 100%;
      max-width: 700px; /* Align with checklist items */
      padding-left: 1rem; /* Indent slightly */
    }

    /* Footer styles copied from MyCloudHome Dashboard */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.5rem 0;
      text-align: center;
      z-index: 1000;
      display: flex; /* Use flexbox for alignment */
      flex-direction: column; /* Stack items by default */
      align-items: center; /* Center items horizontally */
      gap: 0.5rem; /* Space between items */
    }

    .footer .button-group-footer { /* New class for footer buttons */
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 0.5rem; /* Space between buttons and copyright */
      flex-wrap: wrap; /* Allow buttons to wrap on smaller screens */
    }

    .logout-btn, .back-btn { /* Apply common styles to both buttons */
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem; /* Consistent padding */
      border: none; /* Ensure no default border */
      color: white; /* Ensure text color is white */
    }

    .logout-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(255, 107, 107, 0.4);

    .logout-btn:active {
      transform: translateY(0);
    }

    .copyright {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 0; /* Adjusted for flex container */
      font-weight: 300;
    }

    /* Back to Dashboard button styles - moved and adjusted */
    .back-btn {
      background: linear-gradient(135deg, #4CAF50, #2E8B57); /* Greenish gradient */
      box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
      background: linear-gradient(135deg, #4CAF50, #228B22);
    }

    .back-btn:active {
      transform: translateY(0);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      
      .header h1 {
        font-size: 2rem;
      }

      .button-group {
        flex-direction: column;
        gap: 0.8rem;
      }

      .action-btn {
        width: 100%;
      }

      .checklist-item {
        padding: 1rem 1.5rem;
      }

      .checklist-item input[type="checkbox"] {
        width: 20px;
        height: 20px;
      }

      .checklist-item-text {
        font-size: 1rem;
      }

      /* Footer responsive adjustments */
      .footer .button-group-footer {
        flex-direction: column; /* Stack buttons vertically in footer on small screens */
        width: 100%;
        padding: 0 1rem; /* Add some horizontal padding */
      }

      .logout-btn, .back-btn {
        width: 100%; /* Make buttons full width when stacked */
        padding: 0.6rem 1.5rem;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      /* No specific changes needed beyond 768px for checklist items, as they already stack well */
    }
  </style>

    /**
     * Creates and appends a checklist item or header to the container.
     * @param {string} text The text content for the item/header.
     * @param {boolean} [isChecked=false] Whether the item is checked (only applicable for 'item' type).
     * @param {string} type The type of element: 'item' or 'header'.
     */
    function createChecklistItemElement(text, isChecked, type) {
      const checklistContainer = document.getElementById('checklistContainer');
      
      if (type === 'header') {
        const headerDiv = document.createElement('div');
        headerDiv.classList.add('checklist-date-header');
        headerDiv.textContent = text;
        checklistContainer.appendChild(headerDiv);
      } else {
        const itemDiv = document.createElement('div');
        itemDiv.classList.add('checklist-item');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        // Set checked state based on the passed isChecked parameter
        checkbox.checked = isChecked; 
        // Save state on change
        checkbox.onchange = saveChecklistItems; 

        const textSpan = document.createElement('span');
        textSpan.classList.add('checklist-item-text');
        textSpan.textContent = text;

        itemDiv.appendChild(checkbox);
        itemDiv.appendChild(textSpan);
        checklistContainer.appendChild(itemDiv);

        // Apply strikethrough and opacity if initially checked
        if (isChecked) {
          textSpan.style.textDecoration = 'line-through';
          textSpan.style.opacity = '0.7';
        }
      }
    }

    /**
     * Hides (or shows) checked checklist items.
     */
    function hideCheckedItems() {
      const checkboxes = document.querySelectorAll('.checklist-item input[type="checkbox"]');
      checkboxes.forEach(checkbox => {
        if (checkbox.checked) {
          checkbox.closest('.checklist-item').classList.add('hidden');
        } else {
          // Ensure unchecked items are visible if they were previously hidden
          checkbox.closest('.checklist-item').classList.remove('hidden'); 
        }
      });
      // After hiding, save the current state to localStorage
      saveChecklistItems();
    }

    /**
     * Clears all checklist items from the display and local storage.
     */
    function clearAllItems() {
      if (confirm('Are you sure you want to clear all checklist items? This cannot be undone!')) {
        document.getElementById('checklistContainer').innerHTML = ''; // Clears all items
        localStorage.removeItem('checklistItems'); // Remove from local storage
      }
    }

    /**
     * Saves the current state of checklist items (including headers) to local storage.
     */
    function saveChecklistItems() {
      const items = [];
      // Iterate through all direct children of the checklistContainer
      document.querySelectorAll('#checklistContainer > div').forEach(element => {
        if (element.classList.contains('checklist-item')) {
          const text = element.querySelector('.checklist-item-text').textContent;
          const isChecked = element.querySelector('input[type="checkbox"]').checked;
          items.push({ type: 'item', text, isChecked });
        } else if (element.classList.contains('checklist-date-header')) {
          // For headers, just save the type and text
          items.push({ type: 'header', text: element.textContent });
        }
      });
      localStorage.setItem('checklistItems', JSON.stringify(items));
    }

    /**
     * Loads checklist items from local storage, or initializes with default data.
     */
    function loadChecklistItems() {
      const storedItems = localStorage.getItem('checklistItems');
      const checklistContainer = document.getElementById('checklistContainer');
      checklistContainer.innerHTML = ''; // Clear existing content before loading

      if (storedItems) {
        const items = JSON.parse(storedItems);
        items.forEach(item => {
          // Pass the isChecked state for items, or false for headers (though not strictly needed for headers)
          createChecklistItemElement(item.text, item.isChecked || false, item.type); 
        });
      } else {
        // Load initial data if nothing is in local storage
        initialChecklistData.forEach(item => {
          // For initial load, items are not checked by default
          createChecklistItemElement(item.text, false, item.type); 
        });
        saveChecklistItems(); // Save the initial data to local storage after rendering
      }
    }
