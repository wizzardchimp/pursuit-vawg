<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV — MyCloud</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            -webkit-text-size-adjust: 100%;
            padding: 0 0 90px 0;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 226, 0.3) 0%, transparent 50%);
            animation: float 150s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* Banner */
        .banner {
            width: 100%;
            max-width: 380px;
            margin-bottom: 28px;
            opacity: 0;
            animation: slideDown 0.8s ease-out 0.2s forwards;
        }

        .banner img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .page-header {
            width: 100%;
            text-align: center;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeIn 0.6s ease 0.3s forwards;
        }

        .page-banner {
            width: 300px;
            height: 70px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-banner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .page-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        /* Video List */
        .video-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-item {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.5s ease forwards;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .video-item:nth-child(1) { animation-delay: 0.4s; }
        .video-item:nth-child(2) { animation-delay: 0.5s; }
        .video-item:nth-child(3) { animation-delay: 0.6s; }
        .video-item:nth-child(4) { animation-delay: 0.7s; }
        .video-item:nth-child(5) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .video-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .video-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .video-icon svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .video-info {
            flex: 1;
        }

        .video-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }

        .video-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        /* Video Player Popup */
        .player-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        .player-overlay.show {
            display: flex;
        }

        .player-box {
            width: 100%;
            max-width: 500px;
            background: rgba(26, 26, 26, 0.95);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            animation: popIn 0.3s ease 0.1s forwards;
        }

        @keyframes popIn {
            to { 
                transform: scale(1); 
                opacity: 1;
            }
        }

        .player-header {
            padding: 16px 18px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .close-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.9);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-player {
            width: 100%;
            height: 100%;
        }

        .error-message {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .controls {
            background: rgba(0, 0, 0, 0.5);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            min-width: 90px;
            text-align: right;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active:not(:disabled) {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .volume-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .volume-slider {
            width: 70px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .volume-fill {
            height: 100%;
            background: #667eea;
            border-radius: 2px;
            width: 100%;
        }

        /* Back Button */
        .back-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px 16px;
            display: flex;
            justify-content: center;
            z-index: 100;
            background: linear-gradient(to top, rgba(102, 126, 234, 0.3) 0%, transparent);
            opacity: 0;
            animation: fadeIn 0.4s ease 1s forwards;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.3s ease;
            min-height: 50px;
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .back-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.35);
        }

        /* Responsive */
        @media screen and (max-width: 360px) {
            .container {
                padding: 16px;
            }

            .page-banner {
                width: 240px;
                height: 56px;
            }

            .video-item {
                padding: 14px 16px;
            }

            .video-icon {
                width: 44px;
                height: 44px;
            }

            .video-icon svg {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <div class="page-banner">
                <img src="../images/mycloudbanner.png" alt="myCloud CCTV">
            </div>
            <p class="page-subtitle">Select a recording to view</p>
        </div>

        <!-- Video List -->
        <div class="video-list" id="videoList">
            <!-- Videos will be inserted here by JavaScript -->
        </div>
    </div>

    <!-- Video Player Popup -->
    <div class="player-overlay" id="playerOverlay">
        <div class="player-box">
            <div class="player-header">
                <div class="player-title" id="playerTitle">CCTV Recording</div>
                <button class="close-btn" id="closeBtn">×</button>
            </div>

            <div class="video-container">
                <video class="video-player" id="videoPlayer" style="display: none;">
                    Your browser does not support the video tag.
                </video>
                <div class="error-message" id="errorMessage" style="display: none;">
                    Unable to load video
                </div>
            </div>

            <div class="controls">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                </div>

                <div class="control-buttons">
                    <button class="control-btn" id="playPauseBtn" disabled>Play</button>
                    <div class="volume-container">
                        <span class="volume-label">Vol</span>
                        <div class="volume-slider" id="volumeSlider">
                            <div class="volume-fill" id="volumeFill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Back Button -->
    <div class="back-wrap">
        <a class="back-btn" href="../mycloudhome.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Return to Home
        </a>
    </div>

    <script>
        class CCTVPlayer {
            constructor() {
                this.videoFiles = [
                    { name: 'CCTV Camera 1', file: 'cctv_1.mp4', size: '124 MB' },
                    { name: 'CCTV Camera 2', file: 'cctv_2.mp4', size: '98 MB' },
                    { name: 'CCTV Camera 3', file: 'cctv_3.mp4', size: '156 MB' },
                    { name: 'CCTV Camera 3 (Deleted)', file: 'cctv_3(deleted).mkv', size: '142 MB' },
                    { name: 'CCTV Camera 4 (Deleted)', file: 'cctv_4 (deleted).mp4', size: '87 MB' }
                ];
                
                this.currentVideo = null;
                this.initializeElements();
                this.bindEvents();
                this.renderVideoList();
            }

            initializeElements() {
                this.videoList = document.getElementById('videoList');
                this.playerOverlay = document.getElementById('playerOverlay');
                this.videoPlayer = document.getElementById('videoPlayer');
                this.playerTitle = document.getElementById('playerTitle');
                this.closeBtn = document.getElementById('closeBtn');
                this.playPauseBtn = document.getElementById('playPauseBtn');
                this.progressBar = document.getElementById('progressBar');
                this.progressFill = document.getElementById('progressFill');
                this.timeDisplay = document.getElementById('timeDisplay');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.volumeFill = document.getElementById('volumeFill');
                this.errorMessage = document.getElementById('errorMessage');
            }

            bindEvents() {
                this.closeBtn.addEventListener('click', () => this.closePlayer());
                this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
                this.progressBar.addEventListener('click', (e) => this.handleProgressClick(e));
                this.volumeSlider.addEventListener('click', (e) => this.handleVolumeClick(e));
                
                this.videoPlayer.addEventListener('loadedmetadata', () => this.updateTimeDisplay());
                this.videoPlayer.addEventListener('timeupdate', () => this.updateProgress());
                this.videoPlayer.addEventListener('play', () => this.updatePlayButton());
                this.videoPlayer.addEventListener('pause', () => this.updatePlayButton());
                this.videoPlayer.addEventListener('error', () => this.handleVideoError());

                this.playerOverlay.addEventListener('click', (e) => {
                    if (e.target === this.playerOverlay) {
                        this.closePlayer();
                    }
                });
            }

            renderVideoList() {
                this.videoList.innerHTML = this.videoFiles.map((video, index) => `
                    <div class="video-item" onclick="player.openVideo(${index})">
                        <div class="video-icon">
                            <svg viewBox="0 0 576 512">
                                <path d="M0 128C0 92.7 28.7 64 64 64H320c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128zM559.1 99.8c10.4 5.6 16.9 16.4 16.9 28.2V384c0 11.8-6.5 22.6-16.9 28.2s-23 5-32.9-1.6l-96-64L416 337.1V320 192 174.9l14.2-9.5 96-64c9.8-6.5 22.4-7.2 32.9-1.6z"/>
                            </svg>
                        </div>
                        <div class="video-info">
                            <div class="video-name">${video.name}</div>
                            <div class="video-meta">${video.size}</div>
                        </div>
                    </div>
                `).join('');
            }

            openVideo(index) {
                this.currentVideo = this.videoFiles[index];
                this.playerTitle.textContent = this.currentVideo.name;
                this.videoPlayer.src = this.currentVideo.file;
                this.videoPlayer.style.display = 'block';
                this.errorMessage.style.display = 'none';
                this.playPauseBtn.disabled = false;
                this.playerOverlay.classList.add('show');
                this.videoPlayer.play();
            }

            closePlayer() {
                this.playerOverlay.classList.remove('show');
                this.videoPlayer.pause();
                this.videoPlayer.src = '';
                this.currentVideo = null;
                this.playPauseBtn.disabled = true;
            }

            togglePlayPause() {
                if (this.videoPlayer.paused) {
                    this.videoPlayer.play();
                } else {
                    this.videoPlayer.pause();
                }
            }

            updatePlayButton() {
                this.playPauseBtn.textContent = this.videoPlayer.paused ? 'Play' : 'Pause';
            }

            handleProgressClick(event) {
                const rect = this.progressBar.getBoundingClientRect();
                const percent = (event.clientX - rect.left) / rect.width;
                this.videoPlayer.currentTime = percent * this.videoPlayer.duration;
            }

            updateProgress() {
                if (this.videoPlayer.duration) {
                    const percent = (this.videoPlayer.currentTime / this.videoPlayer.duration) * 100;
                    this.progressFill.style.width = percent + '%';
                    this.updateTimeDisplay();
                }
            }

            updateTimeDisplay() {
                const current = this.formatTime(this.videoPlayer.currentTime || 0);
                const total = this.formatTime(this.videoPlayer.duration || 0);
                this.timeDisplay.textContent = `${current} / ${total}`;
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            handleVolumeClick(event) {
                const rect = this.volumeSlider.getBoundingClientRect();
                const percent = (event.clientX - rect.left) / rect.width;
                this.videoPlayer.volume = Math.max(0, Math.min(1, percent));
                this.volumeFill.style.width = (percent * 100) + '%';
            }

            handleVideoError() {
                this.videoPlayer.style.display = 'none';
                this.errorMessage.style.display = 'block';
                this.errorMessage.textContent = `Unable to load: ${this.currentVideo.name}\n\nFile deleted (3hrs 27mins ago)`;
                this.playPauseBtn.disabled = true;
            }
        }

        const player = new CCTVPlayer();
    </script>
</body>
</html>
