<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My HR Portal — AutoStore</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue:       #1e8fff;
            --blue-dark:  #0a6fcf;
            --blue-glow:  rgba(30, 143, 255, 0.35);
            --bg:         #050b14;
            --surface:    #0c1829;
            --surface2:   #0f2040;
            --border:     rgba(30, 143, 255, 0.2);
            --text:       #e8f4ff;
            --text-dim:   rgba(232, 244, 255, 0.45);
            --red:        #ff4444;
            --red-dim:    rgba(255, 68, 68, 0.15);
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 90px 0;
            opacity: 0;
            animation: pageIn 0.6s ease forwards;
        }

        @keyframes pageIn {
            to { opacity: 1; }
        }

        /* Background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(30, 143, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 143, 255, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        /* === HEADER === */
        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 20px 0;
            position: relative;
            z-index: 1;
        }

        .logo-wrap {
            width: 300px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            opacity: 0;
            transform: translateY(-12px);
            animation: dropIn 0.5s ease 0.2s forwards;
        }

        .logo-wrap img {
            width: 300px;
            height: 80px;
            object-fit: contain;
        }

        @keyframes dropIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header-divider {
            width: 90%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--blue), transparent);
            margin: 14px 0 4px;
            opacity: 0;
            animation: fadeIn 0.4s ease 0.5s forwards;
        }

        .header-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            letter-spacing: 0.22em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeIn 0.4s ease 0.6s forwards;
        }

        /* === PIN CONTAINER === */
        .pin-container {
            width: 100%;
            max-width: 440px;
            padding: 0 16px;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 0.4s ease 0.7s forwards;
        }

        .pin-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 36px 24px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        /* Top accent line */
        .pin-box::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--blue), transparent);
            opacity: 0.5;
        }

        .pin-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: rgba(30, 143, 255, 0.1);
            border: 1px solid rgba(30, 143, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--blue);
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pin-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .pin-subtitle {
            font-family: 'Exo 2', sans-serif;
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* === PIN INPUT === */
        .pin-input-wrap {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .pin-digit {
            width: 56px;
            height: 64px;
            background: rgba(30, 143, 255, 0.05);
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            outline: none;
            transition: background 0.2s, border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .pin-digit:focus {
            background: rgba(30, 143, 255, 0.1);
            border-color: var(--blue);
        }

        .pin-digit.error {
            animation: shake 0.4s ease;
            border-color: var(--red);
            background: var(--red-dim);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* === ERROR MESSAGE === */
        .error-msg {
            color: var(--red);
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 12px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error-msg.show {
            opacity: 1;
        }

        /* === VERIFY BUTTON === */
        .verify-btn {
            width: 100%;
            padding: 16px;
            background: var(--blue);
            border: 1px solid var(--blue-dark);
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #000;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .verify-btn:active {
            background: var(--blue-dark);
            transform: scale(0.98);
        }

        .verify-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* === SUSPENDED MESSAGE POPUP === */
        .suspended-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        .suspended-overlay.show {
            display: flex;
        }

        .suspended-box {
            background: var(--surface2);
            border: 1px solid rgba(255, 68, 68, 0.4);
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            transform: scale(0.9);
            animation: popIn 0.3s ease 0.2s forwards;
        }

        @keyframes popIn {
            to { 
                transform: scale(1); 
                opacity: 1;
            }
        }

        .suspended-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            background: var(--red-dim);
            border: 1px solid rgba(255, 68, 68, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suspended-icon svg {
            width: 38px;
            height: 38px;
            stroke: var(--red);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .suspended-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text);
            text-transform: uppercase;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .suspended-message {
            font-family: 'Exo 2', sans-serif;
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .continue-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--text);
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            display: block;
        }

        .continue-btn:active {
            background: rgba(30, 143, 255, 0.14);
            border-color: var(--blue);
            color: var(--blue);
        }

        /* === BACK BUTTON === */
        .back-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px 16px;
            display: flex;
            justify-content: center;
            z-index: 100;
            background: linear-gradient(to top, #050b14 60%, transparent);
            opacity: 0;
            animation: fadeIn 0.4s ease 1.2s forwards;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            padding: 14px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .back-btn svg {
            stroke: var(--text-dim);
            transition: stroke 0.15s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background: rgba(30, 143, 255, 0.07);
            border-color: var(--blue);
            color: var(--blue);
        }

        .back-btn:active {
            background: rgba(30, 143, 255, 0.14);
            border-color: var(--blue);
            color: var(--blue);
        }

        .back-btn:active svg,
        .back-btn:hover svg {
            stroke: var(--blue);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* === RESPONSIVE === */
        @media screen and (max-width: 360px) {
            .pin-box {
                padding: 28px 20px;
            }

            .pin-digit {
                width: 50px;
                height: 58px;
                font-size: 28px;
            }

            .pin-input-wrap {
                gap: 10px;
            }

            .suspended-box {
                padding: 28px 22px;
            }

            .logo-wrap {
                width: 240px;
                height: 64px;
            }

            .logo-wrap img {
                width: 240px;
                height: 64px;
            }
        }

        @media screen and (min-width: 420px) {
            .pin-container {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo-wrap">
            <img src="ashomelogo.png" alt="AutoStore Logo">
        </div>
        <div class="header-divider"></div>
        <div class="header-sub">My HR Portal — Secure Access</div>
    </div>

    <!-- PIN ENTRY -->
    <div class="pin-container">
        <div class="pin-box">
            <div class="pin-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>

            <div class="pin-title">Enter Your PIN</div>
            <div class="pin-subtitle">Please enter your 4-digit PIN to access<br>your HR portal account</div>

            <div class="pin-input-wrap">
                <input type="tel" maxlength="1" class="pin-digit" id="pin1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" maxlength="1" class="pin-digit" id="pin2" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" maxlength="1" class="pin-digit" id="pin3" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" maxlength="1" class="pin-digit" id="pin4" inputmode="numeric" pattern="[0-9]*">
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <button class="verify-btn" id="verifyBtn">Verify PIN</button>
        </div>
    </div>

    <!-- SUSPENDED ACCOUNT OVERLAY -->
    <div class="suspended-overlay" id="suspendedOverlay">
        <div class="suspended-box">
            <div class="suspended-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>

            <div class="suspended-title">Account Suspended</div>
            <div class="suspended-message">
                Correct PIN Entered, However your account is locked.<br>
                Please contact a supervisor for assistance.
            </div>

            <a href="as_home.html" class="continue-btn">Continue</a>
        </div>
    </div>

    <!-- BACK BUTTON -->
    <div class="back-wrap">
        <a class="back-btn" href="as_home.html">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Back to Home
        </a>
    </div>

    <script>
        const pin1 = document.getElementById('pin1');
        const pin2 = document.getElementById('pin2');
        const pin3 = document.getElementById('pin3');
        const pin4 = document.getElementById('pin4');
        const verifyBtn = document.getElementById('verifyBtn');
        const errorMsg = document.getElementById('errorMsg');
        const suspendedOverlay = document.getElementById('suspendedOverlay');

        const pinInputs = [pin1, pin2, pin3, pin4];

        // Auto-focus next field on input
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Only allow numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');

                // Move to next field if digit entered
                if (e.target.value.length === 1 && index < 3) {
                    pinInputs[index + 1].focus();
                }

                // Clear error state
                pinInputs.forEach(inp => inp.classList.remove('error'));
                errorMsg.classList.remove('show');
                errorMsg.textContent = '';
            });

            // Handle backspace - move to previous field
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    pinInputs[index - 1].focus();
                }

                // Submit on Enter
                if (e.key === 'Enter') {
                    verifyBtn.click();
                }
            });

            // Select all on focus
            input.addEventListener('focus', (e) => {
                e.target.select();
            });
        });

        // Verify PIN
        verifyBtn.addEventListener('click', function() {
            const enteredPin = pin1.value + pin2.value + pin3.value + pin4.value;

            if (enteredPin.length !== 4) {
                errorMsg.textContent = 'Please enter all 4 digits';
                errorMsg.classList.add('show');
                return;
            }

            if (enteredPin === '1486') {
                // Correct PIN - show suspended message
                suspendedOverlay.classList.add('show');
            } else {
                // Wrong PIN
                errorMsg.textContent = 'Incorrect PIN. Please try again.';
                errorMsg.classList.add('show');
                
                // Shake animation
                pinInputs.forEach(inp => {
                    inp.classList.add('error');
                    inp.value = '';
                });

                // Clear error styling after animation
                setTimeout(() => {
                    pinInputs.forEach(inp => inp.classList.remove('error'));
                    pin1.focus();
                }, 500);
            }
        });

        // Focus first field on page load
        setTimeout(() => {
            pin1.focus();
        }, 1000);
    </script>

</body>
</html>
